# Compila ScrolleR Studio per Windows e Mac.
# - Push di un tag "v*" (es. v1.0.2): compila e pubblica la release con installer e .dmg allegati.
# - "Run workflow" dalla scheda Actions: compila soltanto; i file si scaricano dalla pagina della run.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            files: dist/*.exe
          - os: macos-latest
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dipendenze
        run: python -m pip install -r requirements.txt pillow-heif pyinstaller

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build
        run: python packaging/build.py

      - name: Prova di avvio (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\ScrolleR Studio\ScrolleR Studio.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { Write-Error "L'app si è chiusa subito (codice $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id
          Write-Host "L'app è partita"

      - name: Prova di avvio (Mac)
        if: runner.os == 'macOS'
        run: |
          QT_QPA_PLATFORM=offscreen "dist/ScrolleR Studio.app/Contents/MacOS/ScrolleR Studio" &
          pid=$!
          sleep 10
          if ! kill -0 $pid 2>/dev/null; then wait $pid; echo "L'app si è chiusa subito (codice $?)"; exit 1; fi
          kill $pid
          echo "L'app è partita"

      - uses: actions/upload-artifact@v4
        with:
          name: ScrolleR-Studio-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
