name: scrl_video
description: Video di ScrolleR Studio Mobile con i codificatori del telefono (lettura di fotogrammi e audio, scrittura MP4 H.264/AAC). Unico punto, con la galleria, con codice specifico di piattaforma.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.michelo1927.scrl_video
        pluginClass: ScrlVideoPlugin
      ios:
        pluginClass: ScrlVideoPlugin
