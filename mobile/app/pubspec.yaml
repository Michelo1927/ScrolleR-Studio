name: scrollr_studio
description: "ScrolleR Studio Mobile: collage e caroselli di foto per i social."
publish_to: none

# Versione dell'app. Nelle release la CI usa quella del tag mobile-vX.Y.Z (--build-name).
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  material_ui: ^1.1.0
  scrl_engine:
    path: ../packages/scrl_engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
